name: tmp-ip-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: |
          node -e "
          const B='https://api.tidesandcurrents.noaa.gov';
          const u={
            'stations.json': B+'/mdapi/prod/webapi/stations.json?type=currentpredictions&units=english',
            'harcon@currbin': B+'/mdapi/prod/webapi/stations/PUG1717/harcon.json?units=english&bin=35',
            'offsets': B+'/mdapi/prod/webapi/stations/PCT0236_1/currentpredictionoffsets.json',
            'datagetter': B+'/api/prod/datagetter?product=currents_predictions&interval=max_slack&time_zone=gmt&units=english&format=json&station=PUG1717&bin=35&begin_date=20260719&end_date=20260720',
          };
          (async()=>{ for(const [k,v] of Object.entries(u)){
            try{ const r=await fetch(v); const t=await r.text();
              console.log(k.padEnd(16), 'HTTP', r.status, 'bytes='+t.length);
            }catch(e){ console.log(k.padEnd(16),'THREW',e.message); }
          }})();"
