name: update-stations
# Keeps the committed bundle in step with NOAA, and opens a PR when it moves.
#
# Two cadences, because they catch different things:
#   weekly  — cheap pre-flight (ONE request for the station list). Full extraction only
#             if a station was added, removed, or reclassified.
#   monthly — forced full extraction. The pre-flight cannot see NOAA revising the
#             constituents of a station that already exists; only a bundle diff can.
#
# A full extraction is ~2,800 paced requests, ~25 min, verified to complete from a
# GitHub-hosted runner without throttling failures.
on:
  schedule:
    - cron: '17 13 * * 1' # Mondays — pre-flight
    - cron: '17 13 1 * *' # 1st of the month — forced
  workflow_dispatch:
    inputs:
      force:
        description: Run the full extraction even if the station list is unchanged
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pre-flight — has NOAA's station list changed?
        id: preflight
        run: |
          set +e
          node bin/current-stations.mjs check 2> drift.txt
          echo "drifted=$([ $? -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Decide whether to extract
        id: decide
        run: |
          FORCE="${{ github.event.schedule == '17 13 1 * *' || inputs.force }}"
          DRIFTED="${{ steps.preflight.outputs.drifted }}"
          if [ "$FORCE" = "true" ] || [ "$DRIFTED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Station list unchanged and not a forced run — nothing to do."
          fi

      - name: Full extraction
        if: steps.decide.outputs.run == 'true'
        run: |
          node bin/current-stations.mjs extract currents.json --pace 300
          node bin/current-stations.mjs lock stations.lock.json

      # Validate BEFORE opening a PR. A PR opened by GITHUB_TOKEN does not trigger CI,
      # so this is the gate — a truncated extraction must never reach review looking clean.
      - name: Validate the bundle
        if: steps.decide.outputs.run == 'true'
        run: node bin/current-stations.mjs validate currents.json

      - name: Open a PR if anything changed
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `generated` timestamps change on every run; ignore them when deciding
          # whether there is a real change to review.
          if git diff --quiet -- currents.json stations.lock.json; then
            echo "No changes."; exit 0
          fi
          CHANGED=$(git diff --numstat -- currents.json | awk '{print $1" added, "$2" removed"}')
          if [ "$(git diff --numstat -- currents.json stations.lock.json | wc -l)" -gt 0 ] && \
             [ -z "$(git diff -U0 -- currents.json stations.lock.json | grep '^[+-]' | grep -v '^[+-][+-]' | grep -v '"generated"')" ]; then
            echo "Only the generated timestamp changed — not opening a PR."; exit 0
          fi

          BRANCH="noaa-station-update-$(date +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add currents.json stations.lock.json
          git commit -m "data: refresh NOAA current-station bundle"
          git push -q origin "$BRANCH"

          {
            echo "NOAA's current-station data has changed."
            echo
            echo '```'
            node bin/current-stations.mjs validate currents.json 2>&1
            echo '```'
            echo
            echo "Bundle diff: $CHANGED lines."
            echo
            if [ -s drift.txt ]; then
              echo "<details><summary>Station-list drift</summary>"
              echo; echo '```'; cat drift.txt; echo '```'; echo "</details>"
            else
              echo "The station *list* is unchanged — this is an in-place revision of"
              echo "existing station data, which only a bundle diff can catch."
            fi
            echo
            echo "Review the diff, merge, then cut a release so consumers pick it up."
          } > body.md

          gh pr create --title "Refresh NOAA current-station bundle" --body-file body.md --head "$BRANCH"
